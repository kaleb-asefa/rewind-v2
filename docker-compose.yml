services:
  rewind:
    build: .
    container_name: rewind
    ports:
      - "80:8000"
    volumes:
      # Guest session databases survive container restarts
      - ./data/sessions:/app/data/sessions
      # Optional, read-only: the 45M-track catalog for audio-feature enrichment
      - ./data/metadata:/app/data/metadata:ro
    environment:
      - REWIND_DUCKDB_MEMORY_LIMIT=2GB
    restart: unless-stopped
