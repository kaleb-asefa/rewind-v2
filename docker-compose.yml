services:
  rewind:
    build: .
    container_name: rewind
    ports:
      - "80:8000"
    volumes:
      # Guest session databases survive restarts (auto-deleted after the TTL)
      - sessions:/data/sessions
      # Cover-art URL cache shared by every session (public per-song data)
      - cache:/data/cache
      # Optional, read-only: the 45M-track catalog for audio-feature enrichment
      - ./data/metadata:/data/metadata:ro
    environment:
      - REWIND_DUCKDB_MEMORY_LIMIT=2GB
      - REWIND_SESSION_TTL_HOURS=48
    restart: unless-stopped

volumes:
  sessions:
  cache:
