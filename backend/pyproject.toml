[project]
name = "rewind-backend"
version = "2.0.0"
description = "Rewind API — Spotify listening-history analytics (FastAPI + DuckDB)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi[standard]>=0.139.2",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.1.1",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["app/routers/_explore_legacy.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",   # long SQL strings are clearer unwrapped; formatter handles code
    "RUF001", # ambiguous unicode in user-facing strings (…, ─) is intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.13"
packages = ["app"]
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File"]
