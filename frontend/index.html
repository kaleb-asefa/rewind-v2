<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Rewind — deep analytics for your Spotify listening history."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Rewind</title>
    <!-- Apply the saved/system theme before first paint (no flash of the wrong theme). -->
    <script>
      try {
        var t =
          localStorage.getItem('rewind-theme') ||
          (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.classList.toggle('dark', t === 'dark')
        document.documentElement.classList.toggle('light', t !== 'dark')
      } catch (_e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
